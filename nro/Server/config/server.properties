server.db.us=root
server.db.pw=
server.db.maxactive=100

## Cau hinh Game Server (Port 14445 khong trung Ninja 14444 va HTTH 2236)
server.sv=1
server.port=14445
server.sv1=Nro:127.0.0.1:14445:0,0,0

# May chu login noi bo (ServerLogin/server.ini) - tranh cong 8888 cua Web PHP
login.host=127.0.0.1
login.port=9888

server.waitlogin=5
# Termux: moi client deu tu 127.0.0.1 nen nang han muc ket noi/IP
server.maxperip=100
server.maxplayer=1000
server.expserver=1
server.debug=false
server.name=Hashirama Termux
server.domain=http://127.0.0.1:8888/

api.port=8085
api.key=abcdefJKLMNOPQR@STUVWXYrstuv@wABCDEF@GZabxyz

# Cau hinh HikariCP toi uu RAM tren Android
server.hikari.minIdle=2
server.hikari.poolSize=20
server.hikari.cachePre=true
server.hikari.cacheSize=100
server.hikari.cacheSqlLimit=2048

execute.command=java -Xms256m -Xmx1024m -jar server.jar

